<style>
@font-face{font-family:"Literata";src:url(assets/literata.woff2) format("woff2");font-weight:600;font-style:normal;font-display:swap;unicode-range:U+0020-007E,U+00A0-00FF,U+0152-0153,U+0178,U+2013,U+2018-201E,U+2026,U+20AC,U+2122}
:root{
  --paper:#F5F6F1;--card:#FFFFFF;--stub:#DCEAE1;--stub-ink:#1F4733;
  --ink:#1B2430;--muted:#545E6B;--line:#D5D9D2;--accent:#A8231B;--accent-ink:#FFFFFF;
  --chip:#ECEEE8;--chip-on:#1B2430;--chip-on-ink:#FFFFFF;--warn:#7A4200;--warn-bg:#FFF1DC;--ok:#1A5E3C;--ok-bg:#E2F3E9;
  --busy:#E1E2DE;--busy-ink:#5A6068;--play:#DCEAE1;--play-ink:#1F4733;--bar:#9FC3AE;--shade:rgba(10,12,16,.45);
  --serif:"Literata",Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--tabh:56px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11151B;--card:#1A2029;--stub:#1E3328;--stub-ink:#BFE3CD;--ink:#E8EBEF;--muted:#A3ADB9;--line:#2C3440;
  --accent:#FF8A80;--accent-ink:#2A0B08;--chip:#232A34;--chip-on:#E8EBEF;--chip-on-ink:#11151B;--warn:#FFC27A;--warn-bg:#3A2A12;
  --ok:#8FDDB0;--ok-bg:#16301F;--busy:#262C35;--busy-ink:#98A1AC;--play:#1E3328;--play-ink:#BFE3CD;--bar:#3F6E55;--shade:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151B;--card:#1A2029;--stub:#1E3328;--stub-ink:#BFE3CD;--ink:#E8EBEF;--muted:#A3ADB9;--line:#2C3440;
  --accent:#FF8A80;--accent-ink:#2A0B08;--chip:#232A34;--chip-on:#E8EBEF;--chip-on-ink:#11151B;--warn:#FFC27A;--warn-bg:#3A2A12;
  --ok:#8FDDB0;--ok-bg:#16301F;--busy:#262C35;--busy-ink:#98A1AC;--play:#1E3328;--play-ink:#BFE3CD;--bar:#3F6E55;--shade:rgba(0,0,0,.6);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--sat) + 96px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.4 var(--sans);-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* En-tête et onglets */
.top{padding-top:var(--sat);background:var(--paper)}
.top .in{max-width:960px;margin:0 auto;padding:0 12px;height:44px;display:flex;align-items:center;gap:12px}
.brand{font:600 18px/1 var(--serif);text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--accent)}
.maj{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.tabs{position:fixed;z-index:20;left:0;right:0;bottom:0;height:calc(var(--tabh) + var(--sab));padding:0 4px var(--sab);display:grid;grid-template-columns:repeat(4,1fr) 52px;background:var(--card);border-top:1px solid var(--line)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;line-height:1.1;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;padding:4px 2px;min-height:44px;position:relative}
.tab svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.wrap{display:flow-root;max-width:960px;margin:0 auto;padding:0 12px calc(var(--tabh) + var(--sab) + 24px);min-height:100vh}
@media (min-width:900px){
  .top{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
  .top .in{height:56px}
  .tabs{position:static;height:auto;padding:0;display:flex;gap:2px;background:none;border:0;order:2}
  .maj{order:3}
  .tab{flex-direction:row;gap:6px;font-size:14px;padding:0 12px;min-height:44px;border-radius:8px}
  .tab[aria-selected="true"]{background:var(--chip)}
  .tab[aria-selected="true"]::before{display:none}
  .tab.lock .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .wrap{padding-bottom:48px}
  .fbar{top:56px!important}
  .fbar>.chips{flex-wrap:wrap;overflow:visible}
}
/* Commandes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-weight:600;font-size:13px;text-decoration:none;cursor:pointer;white-space:nowrap;position:relative}
.btn::after,.chip::after,.fd::after{content:"";position:absolute;inset:-4px 0}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip{flex:none;display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 11px;border:0;border-radius:999px;background:var(--chip);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;position:relative;text-decoration:none}
.chip::after{inset:-5px 0}
.chip[aria-pressed="true"],.chip[aria-current="page"]{background:var(--chip-on);color:var(--chip-on-ink)}
.chip[aria-expanded="true"]{box-shadow:inset 0 0 0 2px var(--chip-on)}
.chip .x{font-size:15px;line-height:1;margin-left:2px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:5px 12px;margin:0 -12px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap-ok{flex-wrap:wrap;overflow:visible;margin:0;padding:5px 0}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.seg{display:inline-flex;flex:none;background:var(--chip);border-radius:9px;padding:2px}
.seg button,.seg a{min-height:36px;min-width:52px;padding:0 10px;border:0;border-radius:7px;background:none;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;position:relative;color:var(--ink)}
.seg button::after,.seg a::after{content:"";position:absolute;inset:-4px 0}
.seg [aria-pressed="true"],.seg [aria-current="page"]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12)}
select,input[type=search],input[type=password]{height:40px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;max-width:100%;min-width:0}
/* À l'affiche */
.frise{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 12px 4px;margin:0 -12px;height:70px;scroll-snap-type:x proximity;scroll-padding-inline:12px}
.frise::-webkit-scrollbar{display:none}
.fd{flex:none;width:46px;height:58px;border:1px solid var(--line);border-radius:9px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;cursor:pointer;position:relative;scroll-snap-align:start;padding:0}
.fd::after{inset:-4px -2px}
.fd .dw{font-size:11px;color:var(--muted);font-weight:600}
.fd .dn{font:600 18px/1.1 var(--serif)}
.fd .pc{position:absolute;top:-5px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;line-height:18px}
.fd.today{border-color:var(--accent)}
.fd.busy{background:var(--busy);color:var(--busy-ink);border-color:transparent}
.fd.busy .dn{text-decoration:line-through}
.fd.busy .dw{color:var(--busy-ink)}
.fd[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.fd[aria-pressed="true"] .dw{color:inherit}
.tools{display:flex;gap:8px;align-items:center;min-height:46px}
.tools .chips{flex:1;margin-right:-12px;padding-left:2px}
.fbar{position:sticky;top:var(--sat);z-index:10;background:var(--paper);margin:0 -12px;padding:0 12px;border-bottom:1px solid var(--line)}
.fpanel{padding:4px 0 8px}
.fpanel h2{font:600 12px var(--sans);color:var(--muted);margin:6px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.fpanel .row2{display:flex;gap:8px;flex-wrap:wrap}
.fpanel label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);flex:1 1 150px}
.active{display:flex;align-items:center;gap:6px;min-height:36px;font-size:12.5px;color:var(--muted);overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.active::-webkit-scrollbar{display:none}
.active .chip{height:28px;font-size:12px;padding:0 8px;background:var(--chip-on);color:var(--chip-on-ink)}
.active .chip::after{inset:-8px 0}
.active .n{color:var(--ink);font-weight:600}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer;padding:0 4px;min-height:36px;text-decoration:underline;text-underline-offset:2px}
.ml{margin-left:auto}
details.box{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0;font-size:13px}
details.box>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;padding:0 12px;font-weight:600;list-style:none;gap:6px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.box[open]>summary::before{transform:rotate(90deg)}
details.box>summary .ml{font-weight:400;color:var(--muted);font-size:12px}
.vl{list-style:none;margin:0;padding:0 12px 8px}
.vl li{border-top:1px solid var(--line)}
.vl a{display:flex;gap:8px;align-items:baseline;min-height:40px;padding:6px 0;text-decoration:none}
.vl .vd{flex:none;width:96px;color:var(--accent);font-weight:600;font-size:12px}
.vl .vt{flex:1;min-width:0}
.vl .vt b{font-weight:600}
.vl .vt span{color:var(--muted)}
.mh{font:600 15px var(--serif);margin:14px 2px 6px;display:flex;align-items:baseline;gap:8px}
.mh small{font:400 12px var(--sans);color:var(--muted)}
/* Lignes */
.list{display:flex;flex-direction:column;gap:6px}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rb{display:flex;align-items:stretch;width:100%;min-height:62px;border:0;background:none;padding:0;text-align:left;cursor:pointer;text-decoration:none;color:inherit}
.stub{flex:none;width:54px;background:var(--stub);color:var(--stub-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;border-right:2px dashed var(--card);position:relative;padding:4px 2px;text-align:center}
.stub::before,.stub::after{content:"";position:absolute;right:-7px;width:12px;height:12px;border-radius:50%;background:var(--paper)}
.stub::before{top:-7px}.stub::after{bottom:-7px}
.stub b{font:600 18px/1.05 var(--serif)}
.stub small{font-size:10.5px;font-weight:600}
.mid{flex:1;min-width:0;padding:7px 4px 7px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tt{font:600 15px/1.25 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss.av{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.end{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px;padding:6px 10px 6px 4px;max-width:118px}
.st{color:var(--accent);font-size:13px;letter-spacing:.5px;white-space:nowrap;line-height:1}
.st sup{font-size:9px;font-weight:700;margin-left:1px;letter-spacing:0}
.bds{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px}
.b{font-size:10.5px;font-weight:700;padding:2px 5px;border-radius:5px;line-height:1.2;background:var(--chip);color:var(--ink);white-space:nowrap}
.b.yva{background:var(--accent);color:var(--accent-ink)}
.b.jeune{background:var(--ok-bg);color:var(--ok)}
.b.fin{background:var(--warn-bg);color:var(--warn)}
.b.offre{background:var(--chip);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.row.open{border-color:var(--ink)}
.det{padding:8px 12px 12px;border-top:1px dashed var(--line);font-size:13px}
.det p{margin:0 0 6px}
.cr{color:var(--muted)}
.cr a,.pl a,.inl a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px;text-decoration-thickness:1px}
.cr .ro{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;margin-right:2px}
.why{font-style:italic}
.off{list-style:none;margin:0 0 6px;padding:0}
.off li{border-left:3px solid var(--accent);padding:1px 0 1px 8px;margin:4px 0}
.off li.soft{border-color:var(--line)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted);font-size:13px}
/* Mois */
.cal{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0}
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.calh h2,.calh h3{font:600 15px var(--serif);margin:0;text-transform:capitalize}
.calh .btn{min-width:44px;font-size:18px;padding:0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:2px 0}
.cell{position:relative;height:44px;border:0;border-radius:7px;background:var(--paper);color:var(--ink);padding:3px 4px;font-size:12.5px;font-weight:600;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.cell.out{visibility:hidden}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.busy{background:var(--busy);color:var(--busy-ink)}
.cell.busy .n{text-decoration:line-through}
.cell.past{color:var(--muted)}
.cell[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.cell .pc{position:absolute;top:3px;right:3px;font-size:10px;min-width:16px;height:16px;line-height:16px;border-radius:8px;background:var(--accent);color:var(--accent-ink);text-align:center;padding:0 3px}
.dots{display:flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dots i.o{background:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--sw)}
.legend span.dot::before{border-radius:50%;width:7px;height:7px}
.mini .cell{height:32px;cursor:default;font-size:12px;align-items:center;justify-content:center;padding:0}
.mini .cell.play{background:var(--play);color:var(--play-ink)}
.mini .cell.of::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.mini-wrap{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.mini-wrap .cal{margin:0}
/* Feuille */
.sheet{position:fixed;inset:0;z-index:30;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-in{background:var(--paper);width:100%;height:100%;overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--sat) + 0px) 12px calc(var(--sab) + 24px);animation:up .18s ease-out}
.sheet-in:focus{outline:none}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:760px){.sheet{align-items:center;padding:24px}.sheet-in{max-width:720px;height:auto;max-height:calc(100vh - 48px);border-radius:14px;padding:0 18px 20px}}
.shtop{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;align-items:center;gap:8px;height:52px;margin:0 -12px;padding:0 12px;border-bottom:1px solid var(--line)}
@media (min-width:760px){.shtop{margin:0 -18px;padding:0 18px}}
.shtop .k{flex:1;min-width:0;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:44px;height:44px;min-width:44px;padding:0;font-size:20px;border-radius:50%}
.shh{display:flex;gap:0;margin:12px 0 10px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.shh .stub{width:72px}
.shh .stub b{font-size:22px}
.shh .mid{padding:10px 12px}
.shh h2{font:600 20px/1.2 var(--serif);margin:0}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0 0 8px;font-size:13px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.sec{font:600 14px var(--serif);margin:14px 0 6px}
blockquote{margin:6px 0;padding:8px 12px;background:var(--card);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-style:italic}
/* Pages */
.ph{margin:10px 0 8px}
.ph h1{font:600 22px/1.2 var(--serif);margin:0}
.ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.back{display:inline-flex;align-items:center;min-height:40px;color:var(--muted);font-size:13px;text-decoration:none}
.idx{columns:2 170px;column-gap:16px;font-size:13.5px;margin:0;padding:0;list-style:none}
.idx li{break-inside:avoid}
.idx a{display:flex;justify-content:space-between;gap:6px;min-height:36px;align-items:center;text-decoration:none;border-bottom:1px solid var(--line)}
.idx a span{color:var(--muted);font-size:12px}
.letter{font:600 14px var(--serif);color:var(--accent);margin:12px 0 2px;column-span:all}
.lk{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:10px}
.lk li+li{border-top:1px solid var(--line)}
.lk a{display:block;padding:9px 12px;min-height:44px;text-decoration:none}
.lk a b{font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.lk small{display:block;color:var(--muted);font-size:12px}
.bars{display:grid;grid-template-columns:minmax(70px,max-content) 1fr 28px;gap:3px 8px;align-items:center;font-size:12.5px;padding:0 12px 10px}
.bars .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.bars .bg{height:10px;background:var(--bar);border-radius:3px;min-width:2px}
.bars .bn{text-align:right;font-weight:600}
.stats h2{font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:8px 12px 4px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{color:var(--muted);font-weight:600}
.code{font:12px ui-monospace,Menlo,monospace;word-break:break-all;background:var(--chip);padding:6px 8px;border-radius:6px;display:block;margin:4px 0}
.warn{color:var(--warn);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--sab) + 12px);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}
#main{display:flow-root}
.load{color:var(--muted);margin:0;padding:24px 0;text-align:center}
@media (min-width:900px){.list{display:grid;grid-template-columns:1fr 1fr;align-items:start}.list>.mh,.list>.empty{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
