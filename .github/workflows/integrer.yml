# Quand Claude Code envoie une branche claude/…, on vérifie, on fusionne dans main et on déclenche la publication.
# Seules les branches poussées par le propriétaire du dépôt sont intégrées.
name: Intégrer les modifications de Claude Code
on:
  push:
    branches: ["claude/**"]
permissions: {}
concurrency:
  group: integrer
  cancel-in-progress: false
jobs:
  integrer:
    if: github.actor == 'factotumdellacitta' && github.repository == 'factotumdellacitta/saison'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      BRANCHE: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Contrôle des données
        run: node tools/check.mjs
      - name: Fusion dans main
        run: |
          git config user.name "saison-bot"
          git config user.email "saison-bot@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --no-edit "origin/${BRANCHE}"
          node tools/check.mjs
          git push origin main
          git push origin --delete "${BRANCHE}" || true
      - name: Lancer la publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publier.yml --ref main
