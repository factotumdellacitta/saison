# Publie le site sur GitHub Pages. Toutes les heures, met aussi à jour les soirs pris depuis le calendrier Apple.
name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Soirs pris depuis Apple Calendar
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          ICLOUD_ICS_URL: ${{ secrets.ICLOUD_ICS_URL }}
        run: |
          npm install --no-save node-ical@0.27.3
          node tools/sync-dispo.mjs
          if ! git diff --quiet data/dispo.json; then
            git config user.name "saison-bot"
            git config user.email "saison-bot@users.noreply.github.com"
            git add data/dispo.json
            git commit -m "Soirs pris : synchronisation du calendrier"
            git push origin main
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "RIEN_A_PUBLIER=1" >> "$GITHUB_ENV"
          fi
      - name: Contrôle des données
        if: env.RIEN_A_PUBLIER != '1'
        run: node tools/check.mjs
      - name: Préparer le site
        if: env.RIEN_A_PUBLIER != '1'
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/data
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        if: env.RIEN_A_PUBLIER != '1'
      - uses: actions/upload-pages-artifact@v3
        if: env.RIEN_A_PUBLIER != '1'
        with:
          path: _site
      - id: deploiement
        if: env.RIEN_A_PUBLIER != '1'
        uses: actions/deploy-pages@v4
